(function(){

var S9=['2/4','3/4','4/4','5/4','7/8','9/8','12/8','6/8','12/16'];
var SIGS=['2/4','3/4','4/4','5/4','6/4','3/8','5/8','6/8','7/8','9/8','12/8','12/16'];
var st={bpm:100,sig:'4/4',vol:60,sound:true,vib:true,run:false};
try{var v=JSON.parse(localStorage.getItem('bt3')||'null');if(v){st.bpm=v.bpm||100;if(SIGS.indexOf(v.sig)>-1)st.sig=v.sig;if(typeof v.vol==='number')st.vol=v.vol;st.sound=v.sound!==false;st.vib=v.vib!==false}}catch(e){}

var app=document.getElementById('app'),home=document.getElementById('home'),run=document.getElementById('run'),set=document.getElementById('set');
function u(){app.style.setProperty('--u',app.clientWidth/375+'px')}u();addEventListener('resize',u);

function mk(p,tag,cls,x,y,w,h){var e=document.createElement(tag);if(cls)e.className=cls;e.style.left=U(x);e.style.top=U(y);if(w!=null){e.style.width=U(w);e.style.height=U(h)}p.appendChild(e);return e}

function txt(p,c,F){var e=mk(p,'div','txt',c[0]-60,c[1]-.5*F,120,F);e.style.fontSize=U(F);return e}
function hit(p,c,w,h,label,fn,round){var b=C(p,'button','hit',c,w,h);b.setAttribute('aria-label',label);if(!round)b.style.borderRadius=U(h/2);b.onclick=fn;return b}
var upd=[];
function stepper(b,d){var t,iv;function go(){setB(st.bpm+d)}function stopr(){clearTimeout(t);clearInterval(iv)}
  b.onpointerdown=function(e){e.preventDefault();go();stopr();t=setTimeout(function(){iv=setInterval(go,70)},450)};
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,stopr)});
  b.onclick=function(e){if(e.detail===0)go()}}

  b.innerHTML=d<0?'<svg viewBox="0 0 12 22"><path d="M10 2 2 11l8 9"/></svg>':'<svg viewBox="0 0 12 22"><path d="M2 2l8 9-8 9"/></svg>';stepper(b,d);return b}
/* slider con input nativo invisibile: affidabile al tocco */
function slider(p,a,b,min,max,get,set_,kr,label,cls){
  var y=a[1],g=mk(p,'div','sl',0,0,0,0);g.style.cssText='position:absolute;inset:0;pointer-events:none';p.appendChild(g);
  var t=mk(g,'div','trk',a[0],y-2.5,b[0]-a[0],5),f=mk(g,'div','fil',a[0],y-2.5,0,5),k=C(g,'div','kn',a,kr*2,kr*2);
  var r=document.createElement('input');r.type='range';r.className='rg';r.min=min;r.max=max;r.step=1;r.setAttribute('aria-label',label);
  r.style.left=U(a[0]-kr);r.style.top=U(y-20);r.style.width=U(b[0]-a[0]+kr*2);r.style.height=U(40);p.appendChild(r);
  r.oninput=function(){set_(+r.value)};
  upd.push(function(){var q=(get()-min)/(max-min);f.style.width=U(q*(b[0]-a[0]));k.style.left=U(a[0]+q*(b[0]-a[0])-kr);r.value=get();g.classList.toggle('mut',!!cls&&cls())});
  return g}
var ICO='<svg viewBox="0 0 28 24"><path d="M3 9v6h4.5L13 19.5V4.5L7.5 9z"/>';
function ico(m){return ICO+(m?'<path d="M17.5 9.5l6 5M23.5 9.5l-6 5"/>':'<path d="M17 9a4.2 4.2 0 0 1 0 6M20 6.2a8.2 8.2 0 0 1 0 11.6"/>')+'</svg>'}
function fillSel(s){SIGS.forEach(function(x){var o=document.createElement('option');o.value=o.textContent=x;s.appendChild(o)});s.onchange=function(){setS(s.value)}}

/* HOME */
var hN=num(home,P.hn,P.hnh);
stepper(hit(home,P.hminus,56,56,'Diminuisci BPM',null,1),-1);stepper(hit(home,P.hplus,56,56,'Aumenta BPM',null,1),1);
var hS=txt(home,P.hs,27);var hSel=C(home,'select','',P.hpill,190,50);fillSel(hSel);
hit(home,P.hstart,245,66,'Avvia',function(){start()});
hit(home,P.hgear,40,40,'Impostazioni',function(){app.classList.add('setopen')},1);hit(home,P.hinfo,40,40,'Informazioni',info,1);
/* RUN */
var rN=num(run,P.rn,P.rnh);
slider(run,P.rtrk0,P.rtrk1,40,250,function(){return st.bpm},setB,11,'Tempo (BPM)');
var ry=P.rtrk0[1];arrow(run,[34,ry],-1,'Diminuisci BPM');arrow(run,[349,ry],1,'Aumenta BPM');
var rS=txt(run,P.rs,24);var rSel=C(run,'select','',P.rpill,176,47);fillSel(rSel);

slider(run,P.vol0,P.vol1,0,100,function(){return st.vol},function(x){st.vol=x;all();save()},11,'Volume',function(){return !st.sound});

hit(run,P.rgear,40,40,'Impostazioni',function(){app.classList.add('setopen')},1);hit(run,P.rinfo,40,40,'Informazioni',info,1);

var wt=mk(rod,'div','wt',0,0,36,34);wt.style.left='50%';wt.style.marginLeft=U(-18);wt.style.top='auto';
var dots=mk(run,'div','dots',0,P.piv[1]+30,375,8);

hit(set,P.back,44,44,'Indietro',function(){app.classList.remove('setopen')},1);
var sN=num(set,P.sn,P.snh);

var sgb=[];S9.forEach(function(s,i){var b=C(set,'button','sg',P['pill'+i],91,41);b.textContent=s;b.onclick=function(){setS(s)};sgb.push(b)});

function all(){
  [hN,rN,sN].forEach(function(e){e.textContent=st.bpm});
  [hS,rS].forEach(function(e){e.textContent=st.sig});hSel.value=rSel.value=st.sig;

  mu.innerHTML=ico(!st.sound||st.vol===0);mu.setAttribute('aria-label',st.sound?'Silenzia':'Riattiva audio');vv.textContent=st.sound?st.vol:0;

var ctx=null,timer=null,nextT=0,idx=0,queue=[],cur=null,raf=0,dir=-1;

function sched(){while(nextT<ctx.currentTime+.15){var acc=idx===0;click(nextT,acc);dir=-dir;queue.push({t:nextT,i:idx,acc:acc,d:dir});nextT+=60/st.bpm;idx=(idx+1)%nb()}}
function frame(){
  var now=ctx.currentTime;
  while(queue.length&&queue[0].t<=now){cur=queue.shift();var d=dots.children;for(var k=0;k<d.length;k++)d[k].className='';if(d[cur.i])d[cur.i].className='on'+(cur.acc?' acc':'');if(st.vib&&navigator.vibrate)try{navigator.vibrate(cur.acc?30:12)}catch(e){}}
  if(cur){var nx=queue[0],du=nx?nx.t-cur.t:60/st.bpm,ph=Math.min(1,Math.max(0,(now-cur.t)/du));rod.style.transform='rotate('+(cur.d*24*Math.cos(Math.PI*ph))+'deg)'}

  if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
